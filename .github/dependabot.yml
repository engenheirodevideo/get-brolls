version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-runtime:
        patterns: ["*"]
    ignore:
      # ruff/pylint/astroid mudam a régua de lint sem ninguém tocar o repositório
      # (o `extend-select` do ruff segue o conjunto padrão, que cresce nos minors 0.x);
      # bump manual, junto com uma re-baseline das supressões existentes, para que
      # regra nova nunca trave um PR de runtime do grupo acima.
      - dependency-name: ruff
      - dependency-name: pylint
      - dependency-name: astroid
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Fixado de propósito (CHANGELOG 2.6.0, Limites); sobe à mão, junto com docs/GUIDE.md
      # e os testes que citam a versão.
      - dependency-name: "@playwright/cli"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Um PR só para todas as Actions: codeql-action/init e /analyze precisam da mesma versão.
    groups:
      github-actions:
        patterns: ["*"]
