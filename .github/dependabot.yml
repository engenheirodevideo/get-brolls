version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
    ignore:
      # pylint/astroid mudam a régua de lint sem ninguém tocar o repositório;
      # bump manual, junto com uma re-baseline das supressões existentes.
      - dependency-name: pylint
      - dependency-name: astroid
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
