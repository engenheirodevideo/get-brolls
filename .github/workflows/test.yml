name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check installer (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh --check
      - name: Check installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Check
      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1
      - name: Exercise PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/playwright.ps1 --version
      - run: python -m unittest discover -s tests -v
      - name: Check Bash scripts
        if: runner.os != 'Windows'
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: node --check assets/storyboard.js
      - run: node --check assets/review.js
