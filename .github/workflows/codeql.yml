name: CodeQL
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4 # TODO(pin): replace with commit SHA before push
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4 # TODO(pin): replace with commit SHA before push
        with:
          category: /language:python
