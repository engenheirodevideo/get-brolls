name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve tag and version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) printf 'Tag "%s" não começa com "v".\n' "$TAG" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Install FFmpeg (the contact-sheet tests need it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run preflight (version, frontmatter, internal material, skill mirror, anchors, suite, changelog section)
        run: bash scripts/preflight.sh --version "$VERSION"
      - name: Extract changelog section
        run: |
          set -euo pipefail
          awk -v header="## $VERSION — " '
            index($0, header) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'CHANGELOG.md não tem a seção "## %s —".\n' "$VERSION" >&2
            exit 1
          fi
      - name: Create release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release %s já existe; nada a fazer.\n' "$TAG"
            exit 0
          fi
          PRERELEASE=()
          case "$TAG" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --title "GET B-ROLLS $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            "${PRERELEASE[@]}"
