name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve tag and version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) printf 'Tag "%s" não começa com "v".\n' "$TAG" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Install FFmpeg (the contact-sheet tests need it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run preflight (version, frontmatter, internal material, skill mirror, anchors, suite, changelog section)
        run: bash scripts/preflight.sh --version "$VERSION"
      - name: Extract changelog section
        run: |
          set -euo pipefail
          awk -v header="## $VERSION — " '
            index($0, header) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'CHANGELOG.md não tem a seção "## %s —".\n' "$VERSION" >&2
            exit 1
          fi
      - name: Create release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release %s já existe; nada a fazer.\n' "$TAG"
            exit 0
          fi
          PRERELEASE=()
          case "$TAG" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --title "GET B-ROLLS $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            "${PRERELEASE[@]}"

  assets:
    # Monta sdist + wheel de um checkout limpo (para fora da raiz), roda o smoke do wheel,
    # atesta a procedência e anexa tudo ao Release criado acima.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: python -m pip install "uv==0.11.14"
      - name: Build sdist and wheel outside the checkout
        run: |
          set -euo pipefail
          python -m uv build -o "$RUNNER_TEMP/dist" .
          test ! -e dist
          ls -l "$RUNNER_TEMP/dist"
      - name: Install the wheel in a fresh venv
        run: |
          set -euo pipefail
          python -m uv venv "$RUNNER_TEMP/venv" --python "$(python -c 'import sys; print(sys.executable)')"
          PY="$RUNNER_TEMP/venv/bin/python"
          python -m uv pip install --python "$PY" "$RUNNER_TEMP"/dist/getbrolls-*.whl
          echo "GB_TEST_WHEEL_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "GB_RUNTIME_DIR=$RUNNER_TEMP/gb-runtime" >> "$GITHUB_ENV"
      - name: Install runtime
        run: bash scripts/install.sh
      - name: Wheel smoke
        env:
          GB_REQUIRE_WHEEL_TESTS: '1'
        run: python -m unittest discover -s tests -p test_wheel_install.py -v
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: Attach sdist and wheel to the release
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/dist/* --clobber
