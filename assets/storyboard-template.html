*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Source Sans 3',Arial,sans-serif}button,select{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:8px 14px}button:hover,select:hover{border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}a{color:var(--accent);text-underline-offset:4px}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button[hidden],[hidden]{display:none!important}header,main{max-width:1400px;margin:auto;padding:24px 32px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:24px}.brand{display:flex;gap:10px;align-items:center;font:700 17px/1 'Archivo',Arial,sans-serif;letter-spacing:-.6px}.brand-logo-frame{width:46px;height:42px;overflow:hidden;display:grid;place-items:center;flex:none}.brand-logo{width:68px;height:68px;max-width:none;object-fit:contain;display:block}.brand span span{display:block}.brand b{color:var(--accent)}.edition{font:11px/1.4 ui-monospace,monospace;letter-spacing:1px;color:var(--muted);text-transform:uppercase}h1,h2,h3{font-family:'Archivo',Arial,sans-serif;font-weight:600;letter-spacing:-.035em}h1{font-size:30px;margin:0}h2{font-size:21px;margin:0}h3{font-size:15px;margin:8px 0 0}.intro{display:flex;justify-content:space-between;align-items:end;margin:6px 0 25px;gap:20px}.sub{color:var(--muted);margin:6px 0 0}.count{color:var(--accent);font:12px ui-monospace,monospace;white-space:nowrap}.tools,.selection,.modes{display:flex;gap:8px;align-items:center}.tools{justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.selection select{width:340px;max-width:65vw}.modes button[aria-pressed=true]{color:var(--accent);background:var(--tint);border-color:var(--accent)}.viewer{display:grid;grid-template-columns:1fr 1fr;gap:20px}.viewer.single{grid-template-columns:1fr;max-width:850px;margin:auto}.pane{margin:0;min-width:0}.pane figcaption{display:flex;justify-content:space-between;gap:15px;margin-bottom:8px;font:11px ui-monospace,monospace;color:var(--muted);text-transform:uppercase}.image-box{height:clamp(260px,38vw,510px);background:#eeeFEB;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.image-box img{width:100%;height:100%;object-fit:contain;display:block}.empty{color:var(--muted);max-width:320px;padding:30px;text-align:center}.material .media{min-height:260px}.material img{display:block;width:100%;height:clamp(260px,38vw,510px);object-fit:contain;background:#eeefeb}.material video{width:100%;max-height:510px;background:#1b1d1a}.material iframe{width:100%;height:clamp(260px,38vw,510px);border:0;background:#1b1d1a}.youtube-preview>button{display:block;width:100%;padding:0;overflow:hidden;border-radius:0;background:#eeefeb;position:relative}.youtube-preview>button>span{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--orange);color:#1b1d1a;border-radius:5px;padding:10px 16px;font-weight:600;white-space:nowrap}.youtube-preview>button:not(:has(img)){min-height:260px}.youtube-preview [role=status]{font-size:13px;color:var(--muted);margin:8px 0}.material p{margin:8px 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}.material a{font-size:14px}.caption{padding:16px 0 18px;border-bottom:1px solid var(--line)}.caption h2{margin-bottom:8px}.caption blockquote{margin:0;padding-left:14px;border-left:3px solid var(--orange);max-width:950px;font-size:19px}.metadata{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.gallery-head{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin:32px 0 18px}.gallery-head p{margin:0;font-size:14px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}.shot{padding:0;text-align:left;background:n agem.jpg" alt="Revelar a origem"><div class="source-details"><strong>Wikimedia / Radulf del Maresme</strong><code>garrafas-reciclagem.jpg</code></div><a href="https://commons.wikimedia.org/wiki/File:Plastic_bottles_for_recycling.jpg" target="_blank" rel="noopener noreferrer">Fonte original ↗</a></section><div class="caption-content"><blockquote>“Mas aí alguém chega com aquele alimento, põe na sua frente e diz assim: Isso aqui era uma garrafa PET.”</blockquote></div></template><template data-shot id="shot-26"><figure class="pane presenter"><figcaption><span>Trecho do vídeo</span><span>01:30.20–01:37.58</span></figcaption><div class="image-box"><button class="gif-preview" data-gif="storyboard-gifs/clip-27.gif" data-poster="storyboard-case/frame-27.jpg" aria-label="Assistir trecho: Minha gravação" aria-pressed="false"><img loading="lazy" src="storyboard-case/frame-27.jpg" alt="Gravação — Minha gravação"><span>▶ Assistir trecho</span></button></div></figure><section class="pane material"><figure class="pane"><figcaption><span>Fonte coletada</span></figcaption></figure><p class="empty">Nenhum B-roll externo neste quadro.</p><div class="source-details"><strong>Minha gravação</strong><code></code></div></section><div class="caption-content"><blockquote>“Você realmente comeria? E mais, se fosse comprovadamente nutritivo e seguro, você daria esse biscoito pros seus filhos?”</blockquote></div></template><noscript>Ative JavaScript para navegar entre os quadros.</noscript></main><script>(() => {
 const templates=[...document.querySelectorAll('template[data-shot]')];
 const select=document.getElementById('select'),viewer=document.getElementById('viewer');
 if(!templates.length)return;
 let index=0,mode='side',activeFrame=null;
 function stop(){if(activeFrame){activeFrame.remove();activeFrame=null;}viewer.querySelectorAll('video').forEach(v=>v.pause());}
 function wire(){viewer.querySelectorAll('[data-gif]').forEach(button=>button.addEventListener('click',()=>{
  const playing=button.getAttribute('aria-pressed')==='true';
  button.querySelector('img').src=playing?button.dataset.poster:button.dataset.gif;
  button.setAttribute('aria-pressed',String(!playing));button.querySelector('span').textContent=playing?'▶ Assistir trecho':'■ Parar GIF';
 }));viewer.querySelectorAll('[data-youtube]').forEach(button=>button.addEventListener('click',()=>{
  stop();const frame=document.createElement('iframe');
  const url=new URL('https://www.youtube-nocookie.com/embed/'+button.dataset.youtube);
  url.searchParams.set('start',button.dataset.start);if(button.dataset.end)url.searchParams.set('end',button.dataset.end);
  url.searchParams.set('autoplay','1');url.searchParams.set('mute','1');url.searchParams.set('playsinline','1');
  frame.title='Trecho selecionado no YouTube';frame.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.src=url.href;
  const status=button.closest('.material').querySelector('[role=status]');
  status.textContent='Player solicitado. Se não tocar, abra o trecho pelo link da fonte.';
  button.hidden=true;button.setAttribute('aria-expanded','true');button.after(frame);activeFrame=frame;
 }));}
 function render(){stop();const t=templates[index],tools=document.getElementById('tools');viewer.replaceChildren(t.content.cloneNode(true));
  const presenter=viewer.querySelector('.presenter');if(tools&&presenter)presenter.append(tools);
  presenter.hidden=mode==='material';viewer.classList.toggle('single',mode==='material');
  const caption=viewer.querySelector('.caption-content');
  if(document.body.classList.contains('film-board'))viewer.querySelector('.material').append(caption);
  else document.getElementById('caption').replaceChildren(caption);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) viewer.querySelectorAll('[data-gif]').forEach(button=>{const img=button.querySelector('img');img.loading='eager';img.src=button.dataset.gif;button.setAttribute('aria-pressed','true');button.querySelector('span').textContent='■ Parar GIF';});
  select.value=String(index);document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===templates.length-1;
  document.getElementById('position').textContent=`${String(index+1).padStart(2,'0')} / ${String(templates.length).padStart(2,'0')}`;
  document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.index)===index)));wire();
 }
 select.addEventListener('change',()=>{index=Number(select.value);render()});

 cards.forEach((card,i)=>{const c=cases[i],r=reviews[c.id]||{state:'pending'},badge=card.querySelector('.status-tag');badge.textContent=labels[r.state];badge.dataset.state=r.state;card.hidden=document.getElementById('pending-only').checked&&r.state!=='pending';card.querySelector('.print-note').textContent=[c.source,c.file,c.sourceStart==null?'':`Fonte: ${c.sourceStart.toFixed(2)}–${c.sourceEnd.toFixed(2)} s`,`“${c.narration}”`,r.comment,r.suggestion].filter(Boolean).join('\n')});}
 function persist(state){const c=current(),panel=document.getElementById('review-panel');reviews[c.id]={state:state||record().state,comment:panel.querySelector('textarea').value,suggestion:panel.querySelector('input').value,updatedAt:new Date().toISOString()};let saved=true;try{localStorage.setItem(key,JSON.stringify(reviews))}catch{saved=false}panel.querySelector('.feedback').textContent=saved?'Salvo neste navegador.':'Sem armazenamento disponível.';panel.querySelectorAll('[data-decision]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.decision===reviews[c.id].state)));summaryUpdate();}
 function mount(){
 const presenter=viewer.querySelector('.presenter');if(tools&&presenter&&!presenter.contains(tools))presenter.append(tools);
 const gif=presenter?.querySelector('[data-gif]');
 if(gif&&!presenter.querySelector('.gif-control')){
  const control=document.createElement('button');control.type='button';control.className='gif-control';
  const sync=()=>{const playing=gif.getAttribute('aria-pressed')==='true';control.innerHTML=playing?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>';control.title=playing?'Pausar GIF':'Reproduzir GIF';control.setAttribute('aria-label',playing?'Pausar GIF':'Reproduzir GIF');};
  control.onclick=()=>{gif.click();sync();};gif.addEventListener('click',sync);
  presenter.querySelector('.image-box').append(control);sync();
 }
 if(document.getElementById('review-panel')){updatePlayerStatus();return}
 const material=viewer.querySelector('.material');if(!material)return;
 const caption=material.querySelector('.caption-content');
 const source=document.createElement('section');source.className='review-source';
 const heading=document.createElement('h2');heading.textContent='Fonte coletada';source.append(heading);
 const original=material.querySelector('a[href]');
 const card=document.createElement(original?'a':'div');card.className='source-link-card';
 if(original){card.href=original.href;card.target='_blank';card.rel='noopener noreferrer';}
 const thumbnail=material.querySelector(':scope > img');
 if(thumbnail){thumbnail.className='source-thumbnail';thumbnail.alt='';card.append(thumbnail);}
 const info=document.createElement('div');info.className='source-link-info';
 if(original){const domain=document.createElement('span');domain.className='source-domain';domain.textContent=new URL(original.href).hostname.replace(/^www\./,'');info.append(domain);}
 const details=material.querySelector('.source-details');if(details)info.append(details);
 const linkLabel=document.createElement('span');linkLabel.className='source-link-label';linkLabel.textContent=original?'Abrir fonte original ↗':'Gravação própria · sem fonte externa';info.append(linkLabel);card.append(info);source.append(card);
 material.replaceChildren(source);
 if(caption){caption.classList.add('review-script');const speech=caption.querySelector('blockquote');if(speech){speech.tabIndex=0;speech.setAttribute('role','region');speech.setAttribute('aria-label','Fala do roteiro');}const label=document.createElement('span');label.className='script-label';label.textContent='Fala do roteiro';caption.prepend(label);material.append(caption);}
 const panel=document.createElement('section');panel.id='review-panel';panel.className='review-panel';
 panel.innerHTML='<h2>Decisão</h2><div class="review-actions"><button class="approve" data-decision="approved" aria-pressed="false">Aprovar</button><button data-decision="changes" aria-pressed="false">Pedir ajuste</button><button data-decision="rejected" aria-pressed="false">Reprovar</button><button data-decision="alternative" aria-pressed="false">Outra fonte</button></div><button class="comment-toggle" aria-expanded="false" aria-controls="review-fields">Comentar</button><div id="review-fields" hidden><label>Comentário<textarea placeholder="Descreva sua observação…"></textarea></label><label class="other-url" hidden>Link de outra fonte (opcional)<input type="url" placeholder="https://..."></label><button class="confirm-review" hidden>Salvar decisão</button></div><p class="feedback" role="status"></p>';
 material.append(panel);const r=record(),fields=panel.querySelector('#review-fields'),toggle=panel.querySelector('.comment-toggle'),comment=panel.querySelector('textarea'),other=panel.querySelector('.other-url'),confirm=panel.querySelector('.confirm-review');let pending=null;
 comment.value=r.comment||'';panel.querySelector('input').value=r.suggestion||'';
 function reveal(open,alternative=false){fields.hidden=!open;other.hidden=!alternative;toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'Fechar comentário':(comment.value?'Ver comentário':'Comentar');}
 toggle.onclick=()=>{pending=null;confirm.hidden=true;reveal(fields.hidden,record().state==='alternative');if(!fields.hidden)comment.focus();};
 panel.querySelectorAll('[data-decision]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.decision===r.state));b.onclick=()=>{
 const state=b.dataset.decision;
 if(['changes','alternative'].includes(state)){pending=state;reveal(true,state==='alternative');confirm.hidden=false;confirm.textContent=state==='changes'?'Confirmar pedido de ajuste':'Confirmar outra fonte';panel.querySelector('.feedback').textContent='';comment.focus();return;}
 pending=null;confirm.hidden=true;reveal(false);persist(state);
 }});
 confirm.onclick=()=>{if(!comment.value.trim()){panel.querySelector('.feedback').textContent='Descreva o que deve mudar.';comment.focus();return;}persist(pending);pending=null;confirm.hidden=true;reveal(false);};
 comment.addEventListener('input',()=>persist());panel.querySelector('input').addEventListener('input',()=>persist());summaryUpdate();
 }
 new MutationObserver(mount).observe(viewer,{childList:true});mount();
 document.getElementById('pending-only').onchange=summaryUpdate;
})();
</script></body></html>
