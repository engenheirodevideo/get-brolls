<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 1452" width="823" height="1452" role="img" aria-label="Mapa da skill: seu pedido, brief, Get B-rolls, fontes, candidatos, sua aprovação, direitos, coleta e verificação, entrega">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8477"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <style>
    .mono{font-family:'SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
    .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;font-size:19px;fill:#1c1917;text-anchor:middle}
    .tw{fill:#fff}
    .s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#44403c;text-anchor:middle}
    .sw{fill:#fff7ed}
    .ln{stroke:#8a8477;stroke-width:1.8;fill:none}
    .red{stroke:#c2410c;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
  </style>

  <!-- frame -->
  <rect x="0" y="0" width="823" height="1452" fill="#141210"/>
  <rect x="0" y="0" width="823" height="58" fill="#1c1917"/>
  <text class="mono" x="36" y="35" font-size="12" fill="#ffffff">GET B-ROLLS / MAPA DA SKILL</text>
  <text class="mono" x="787" y="35" font-size="12" fill="#ffffff" text-anchor="end">Do pedido à entrega ↓</text>
  <rect x="18" y="76" width="787" height="1340" fill="url(#dots)"/>
  <rect x="301" y="90" width="220" height="80" rx="14" fill="#f4511e" stroke="#c2410c"/>
  <text class="t tw" x="411" y="124">Seu pedido</text>
  <text class="s sw" x="411" y="148">Roteiro, tema, link ou arquivo</text>
  <path class="ln" d="M411 170 V222" marker-end="url(#arr)"/>
  <rect x="271" y="228" width="280" height="96" rx="14" fill="#fdf1e3" stroke="#d8cdb8"/>
  <text class="t" x="411" y="264">Brief do projeto</text>
  <text class="s" x="411" y="288">Entrevista curta vira BRIEF.md:</text>
  <text class="s" x="411" y="306">beats, formato e o que evitar</text>
  <path class="ln" d="M411 324 V376" marker-end="url(#arr)"/>
  <rect x="271" y="382" width="280" height="96" rx="14" fill="#f0a175" stroke="#d97d4a"/>
  <text class="t" x="411" y="418">Get B-rolls</text>
  <text class="s" x="411" y="442">Busca por beat e identifica</text>
  <text class="s" x="411" y="460">a fonte e a forma de coleta</text>
  <path class="ln" d="M411 478 V506"/>
  <path class="ln" d="M158 506 H664"/>
  <path class="ln" d="M158 506 V532" marker-end="url(#arr)"/>
  <path class="ln" d="M411 506 V532" marker-end="url(#arr)"/>
  <path class="ln" d="M664 506 V532" marker-end="url(#arr)"/>
  <rect x="48" y="538" width="220" height="88" rx="14" fill="#fdf1e3" stroke="#d8cdb8"/>
  <text class="t" x="158" y="572">Bancos de vídeo</text>
  <text class="s" x="158" y="596">Pexels · Pixabay</text>
  <rect x="301" y="538" width="220" height="88" rx="14" fill="#fdf1e3" stroke="#d8cdb8"/>
  <text class="t" x="411" y="572">Redes sociais</text>
  <text class="s" x="411" y="596">YouTube · Instagram · TikTok</text>
  <rect x="554" y="538" width="220" height="88" rx="14" fill="#fdf1e3" stroke="#d8cdb8"/>
  <text class="t" x="664" y="574">Acervos e arquivos</text>
  <text class="s" x="664" y="598">Commons · NASA · arquivos</text>
  <text class="s" x="664" y="616">locais</text>
  <path class="ln" d="M158 626 V666 H664 V626"/>
  <path class="ln" d="M411 666 V700" marker-end="url(#arr)"/>
  <rect x="271" y="706" width="280" height="96" rx="14" fill="#f0a175" stroke="#d97d4a"/>
  <text class="t" x="411" y="742">Veja os candidatos</text>
  <text class="s" x="411" y="766">Análise da fonte, prévia em</text>
  <text class="s" x="411" y="784">movimento e trecho sugerido</text>
  <path class="ln" d="M411 802 V850" marker-end="url(#arr)"/>
  <rect x="301" y="856" width="220" height="100" rx="28" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text class="t" x="411" y="892">Você aprova?</text>
  <text class="s" x="411" y="916">Confere a imagem e escolhe</text>
  <text class="s" x="411" y="934">o trecho</text>
  <path class="red" d="M521 906 H560"/>
  <text class="mono" x="572" y="911" font-size="12" fill="#c2410c">NÃO → REFAZER BUSCA</text>
  <path class="red" d="M735 906 H788 V430 H559" marker-end="url(#arrR)"/>
  <path class="ln" d="M411 956 V1006" marker-end="url(#arr)"/>
  <text class="mono" x="425" y="987" font-size="12" fill="#faf6ee">SIM</text>
  <rect x="291" y="1012" width="240" height="100" rx="28" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text class="t" x="411" y="1048">Direitos registrados?</text>
  <text class="s" x="411" y="1072">Condições de uso da fonte,</text>
  <text class="s" x="411" y="1090">com evidência real</text>
  <path class="red" d="M531 1062 H570"/>
  <text class="mono" x="582" y="1067" font-size="12" fill="#c2410c">NÃO → FICA DE FORA</text>
  <path class="ln" d="M411 1112 V1162" marker-end="url(#arr)"/>
  <text class="mono" x="425" y="1143" font-size="12" fill="#faf6ee">SIM</text>
  <rect x="221" y="1168" width="380" height="80" rx="14" fill="#f0a175" stroke="#d97d4a"/>
  <text class="t" x="411" y="1202">Coleta e verificação</text>
  <text class="s" x="411" y="1226">Só o trecho aprovado: recorte, hash e decodificação</text>
  <path class="ln" d="M411 1248 V1298" marker-end="url(#arr)"/>
  <rect x="221" y="1304" width="380" height="80" rx="14" fill="#f4511e" stroke="#c2410c"/>
  <text class="t tw" x="411" y="1338">Entrega organizada</text>
  <text class="s sw" x="411" y="1362">entrega/ por beat, com fonte e hash em ORIGEM.md</text>
  <text class="mono" x="411" y="1420" font-size="11" fill="#8a8477" text-anchor="middle">CADA PASSO FICA REGISTRADO EM brolls/getbrolls.log</text>
</svg>
